name: Bundle site images locally
on:
  push:
    paths:
      - ".github/workflows/bundle-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check requests pillow
      - name: Download, validate and bundle images
        run: python scripts/vendor_images.py
      - name: Commit bundled images and local paths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/images
          if ! git diff --cached --quiet; then
            git commit -m "Store every website image locally for GitHub Pages"
            git push origin HEAD:main
          else
            echo "No image changes needed"
          fi
